<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeidenCS verification code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#111827;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f7ff;padding:32px 16px;">
      <tr>
        <td align="center">
          <table width="520" cellpadding="0" cellspacing="0" style="max-width:520px;width:100%;background-color:#ffffff;border-radius:24px;overflow:hidden;border:1px solid rgba(0,17,88,0.14);box-shadow:0 18px 40px rgba(0,17,88,0.10);">
            <tr>
              <td style="padding:36px 32px 24px 32px;text-align:center;background:linear-gradient(180deg,#ffffff 0%,#f3f6ff 100%);">
                <p style="margin:0 auto;font-size:16px;font-weight:700;line-height:1.2;color:#001158;text-align:center;">
                  LeidenCS
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 32px 32px;text-align:center;">
                <p style="margin:0 0 12px 0;font-size:24px;font-weight:700;line-height:1.2;color:#001158;">
                  Your verification code
                </p>
                <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#334155;">
                  Use this code to continue. It is valid for 60 minutes.
                </p>
                <table width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
                  <tr>
                    <td style="padding:28px 20px;border-radius:20px;background-color:#fff7f3;border:1px solid rgba(244,110,50,0.28);text-align:center;">
                      <p style="margin:0;font-size:36px;font-weight:700;line-height:1.1;letter-spacing:0.3em;color:#001158;font-variant-numeric:tabular-nums;">
                        {{ .Token }}
                      </p>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">
                  If you did not request this code, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
